<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="Submit a product review and share your experience with our products.">
    <meta name="author" content="Beker Cubillas">
    <link rel="stylesheet" href="form.css">
    <script src="form.js" defer></script>
</head>
<body>

    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>

        <form method="get" action="review.html">

            <div class="form-group">

                <label for="productName">
                    Product Name *
                </label>

                <select
                    id="productName"
                    name="productName"
                    required
                >
                    <option value="" disabled selected>
                        Select a Product ...
                    </option>
                </select>

            </div>

            <fieldset>

                <legend>Overall Rating *</legend>

                <div class="rating">

                    <input type="radio" id="star1" name="rating" value="1" required>
                    <label for="star1">☆</label>

                    <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2">☆☆</label>

                    <input type="radio" id="star3" name="rating" value="3">
                    <label for="star3">☆☆☆</label>

                    <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4">☆☆☆☆</label>

                    <input type="radio" id="star5" name="rating" value="5">
                    <label for="star5">☆☆☆☆☆</label>

                </div>

            </fieldset>

            <div class="form-group">

                <label for="installDate">
                    Date of Installation *
                </label>

                <input
                    type="date"
                    id="installDate"
                    name="installDate"
                    required
                >

            </div>

            <fieldset>

                <legend>Useful Features</legend>

                <div class="checkbox-group">

                    <input
                        type="checkbox"
                        id="durability"
                        name="features"
                        value="Durability"
                    >
                    <label for="durability">Durability</label>

                    <input
                        type="checkbox"
                        id="ease"
                        name="features"
                        value="Ease of Use"
                    >
                    <label for="ease">Ease of Use</label>

                    <input
                        type="checkbox"
                        id="performance"
                        name="features"
                        value="Performance"
                    >
                    <label for="performance">Performance</label>

                    <input
                        type="checkbox"
                        id="design"
                        name="features"
                        value="Design"
                    >
                    <label for="design">Design</label>

                </div>

            </fieldset>

            <div class="form-group">

                <label for="writtenReview">
                    Written Review
                </label>

                <textarea
                    id="writtenReview"
                    name="writtenReview"
                    rows="5"
                ></textarea>

            </div>

            <div class="form-group">

                <label for="userName">
                    User Name
                </label>

                <input
                    type="text"
                    id="userName"
                    name="userName"
                    required
                >

            </div>

            <input
                type="submit"
                value="Submit Product Review"
                class="submit-btn"
            >

        </form>

    </main>

    <footer>
        <p>
            © <span id="currentyear"></span> 🎮 Beker Cubillas 🎮 Peru
        </p>

        <p>
            Last Modified:
            <span id="lastModified"></span>
        </p>
    </footer>

</body>
</html>
